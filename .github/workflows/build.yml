name: Build Flutter APKs & Appbundle

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Debug atau Release'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Flutter Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [apks, appbundle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🔧 AUTO-FIX + SKIP VALIDATION
        run: |
          echo "🔧 Memperbaiki kompatibilitas..."
          
          # FIX Android V1 Embedding
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/io.flutter.app.FlutterApplication/android.app.Application/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
            sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
            if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
              sed -i '/</application>/i         <meta-data android:name="flutterEmbedding" android:value="2" />' android/app/src/main/AndroidManifest.xml
            fi
          fi

          # FIX font_awesome_flutter
          if grep -q "font_awesome_flutter:" pubspec.yaml; then
            VERSION=$(grep "font_awesome_flutter:" pubspec.yaml | sed 's/.*: //' | tr -d '"' | sed 's/^//g')
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            if [ "$MAJOR" -ge 10 ] && [ "$MINOR" -ge 9 ]; then
              sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: 10.8.0/' pubspec.yaml
            fi
          fi

          # FIX minSdkVersion
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "minSdkVersion" android/app/build.gradle; then
              sed -i '/defaultConfig {/a         minSdkVersion 21' android/app/build.gradle
            fi
          fi

          echo "✅ Auto-fix selesai!"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs (Split by ABI)
        if: matrix.target == 'apks'
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug --split-per-abi --android-skip-build-dependency-validation
          else
            flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          fi

      - name: Build Appbundle
        if: matrix.target == 'appbundle'
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            flutter build appbundle --debug --android-skip-build-dependency-validation
          else
            flutter build appbundle --release --android-skip-build-dependency-validation
          fi

      - name: Upload artifacts
        if: matrix.target == 'apks' || matrix.target == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifacts-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish the binaries
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.build_type == 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get project version
        id: project_version
        uses: its404/get-flutter-version@v1.0.0
        
      - name: Download apks
        uses: actions/download-artifact@v4
        with:
          name: publish-artifacts-apks 
          path: build/app/outputs/flutter-apk/

      - name: Download appbundle
        uses: actions/download-artifact@v4
        with:
          name: publish-artifacts-appbundle 
          path: build/app/outputs/bundle/release/

      - name: Release Binary
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/release/*.aab"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.project_version.outputs.version_number }}+${{steps.project_version.outputs.build_number}}-${{github.run_number}}
          name: "Release ${{ steps.project_version.outputs.version_number }}+${{steps.project_version.outputs.build_number}}"
          generateReleaseNotes: true
